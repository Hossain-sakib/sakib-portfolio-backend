[build]
  command = "npm ci"
  publish = "public"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "24"
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
